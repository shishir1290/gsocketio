name: CI

on:
  push:
    branches: [main, fix/socketio-v4-cross-platform]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Fix generated source formatting and transport parser typo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("transport/transport.go")
          s = p.read_text()
          start = s.index("func(c *PollConn)ReadMessage")
          end = s.index("func(c *PollConn)signalPong")
          replacement = '''func(c *PollConn)ReadMessage()(byte,[]byte,error){
          	for {
          		select {
          		case p := <-c.recvCh:
          			if len(p) == 0 { continue }
          			if p[0] == 'b' {
          				b, err := base64.StdEncoding.DecodeString(string(p[1:])); if err != nil { return 0,nil,ErrProtocol }
          				return OpBinary,b,nil
          			}
          			switch p[0] {
          			case eioPong: c.signalPong(); continue
          			case eioPing: _ = c.WriteText([]byte{eioPong}); continue
          			case eioMessage: return OpText,p[1:],nil
          			case eioClose: return OpClose,p,io.EOF
          			case eioNoop: continue
          			default: return OpText,p,nil
          			}
          		case <-c.closed:
          			return 0,nil,errors.New("poll: connection closed")
          		}
          	}
          }
          '''
          p.write_text(s[:start] + replacement + s[end:])

          p = Path("server/server.go")
          s = p.read_text()
          start = s.index("func(s *Server)dispatchEvent")
          end = s.index("func(s *Server)dispatchAck")
          replacement = '''func(s *Server)dispatchEvent(sess *engineSession,n *namespace,p *packet.Packet,buffers [][]byte){
          	s.sessionMu.Lock(); c:=s.sessions[sess][p.Namespace]; s.sessionMu.Unlock(); if c==nil{return}
          	if p.Type==packet.TypeBinaryEvent {
          		v,err:=packet.Reconstruct(p.Data,buffers); if err!=nil{s.reportError(c,err);return}
          		name,err:=packet.EventName(p.Data); if err!=nil{s.reportError(c,err);return}
          		_,bf:=n.getEvent(name)
          		if a,ok:=v.([]interface{}); ok {
          			if bf!=nil { go bf(c,a,p.ID) }
          			if p.ID!=nil { go func(){ _=c.emitAck(*p.ID,a...) }() }
          		}
          		return
          	}
          	name,err:=packet.EventName(p.Data); if err!=nil{s.reportError(c,err);return}
          	args,err:=packet.EventArgs(p.Data); if err!=nil{s.reportError(c,err);return}
          	fn,_:=n.getEvent(name); if fn!=nil { go fn(c,args) }
          	if p.ID!=nil { go func(){ vals:=make([]interface{},len(args)); for i:=range args { vals[i]=args[i] }; _=c.emitAck(*p.ID,vals...) }() }
          }
          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          gofmt -w .

      - name: Commit formatting/protocol fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: format and correct protocol dispatch"
          git push

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Official Socket.IO protocol suite and Next.js integration
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          TMP="$(mktemp -d)"
          trap 'kill ${SERVER_PID:-0} 2>/dev/null || true; rm -rf "$TMP"' EXIT

          mkdir -p "$TMP/go-server"
          cd "$TMP/go-server"
          cat > go.mod <<EOF
          module protocol-harness

          go 1.22

          require github.com/shishir1290/gsocketio v0.0.0
          replace github.com/shishir1290/gsocketio => $ROOT
          EOF
          cat > main.go <<'EOF'
          package main
          import (
            "encoding/json"
            "net/http"
            sio "github.com/shishir1290/gsocketio"
          )
          func main(){
            s:=sio.New(&sio.Options{PingInterval:300000000, PingTimeout:200000000, MaxPayload:1000000})
            s.OnConnect("/",func(c sio.Conn) error{ _=c.Emit("auth",c.Context()); return nil })
            s.OnConnect("/custom",func(c sio.Conn) error{ _=c.Emit("auth",c.Context()); return nil })
            s.OnEvent("/","message",func(c sio.Conn,args []json.RawMessage){ vals:=make([]interface{},len(args)); for i:=range args { vals[i]=args[i] }; _=c.Emit("message-back",vals...) })
            s.OnBinaryEvent("/","message",func(c sio.Conn,args []interface{},_ *int){ _=c.Emit("message-back",args...) })
            s.OnEvent("/","message-with-ack",func(c sio.Conn,args []json.RawMessage){ vals:=make([]interface{},len(args)); for i:=range args { vals[i]=args[i] }; _=c.Emit("message-back",vals...) })
            s.OnBinaryEvent("/","message-with-ack",func(c sio.Conn,args []interface{},_ *int){ _=c.Emit("message-back",args...) })
            go s.Serve()
            http.Handle("/socket.io/",s)
            if err:=http.ListenAndServe("127.0.0.1:3000",nil); err!=nil { panic(err) }
          }
          EOF
          go run . >/tmp/gsocketio-protocol-server.log 2>&1 & SERVER_PID=$!
          for i in $(seq 1 50); do if curl -fsS 'http://127.0.0.1:3000/socket.io/?EIO=4&transport=polling' >/dev/null; then break; fi; sleep .2; done

          cd "$TMP"
          git clone --depth 1 https://github.com/socketio/socket.io-protocol.git protocol
          cd protocol/test-suite
          npm ci
          npm test

          cd "$TMP"
          mkdir -p next-app
          cd next-app
          cat > package.json <<'EOF'
          {"scripts":{"build":"next build","socket-test":"node socket-test.mjs"},"dependencies":{"next":"16.3.3","react":"19.2.0","react-dom":"19.2.0","socket.io-client":"4.8.3"}}
          EOF
          cat > next.config.mjs <<'EOF'
          export default {};
          EOF
          mkdir -p app
          cat > app/layout.js <<'EOF'
          export default function Layout({children}){return <html><body>{children}</body></html>}
          EOF
          cat > app/page.js <<'EOF'
          export default function Page(){return <main>gsocketio integration</main>}
          EOF
          cat > socket-test.mjs <<'EOF'
          import { io } from "socket.io-client";
          const base="http://127.0.0.1:3000";
          async function test(transports){
            const s=io(base,{transports,timeout:5000,reconnection:false,auth:{token:"integration"}});
            await new Promise((resolve,reject)=>{s.once("connect",resolve);s.once("connect_error",reject)});
            await new Promise((resolve,reject)=>{s.once("auth",v=>v?.token==="integration"?resolve():reject(new Error("auth mismatch")));});
            const got=await new Promise((resolve,reject)=>{s.once("message-back",resolve);s.emit("message","hello",123)});
            if(got?.[0]!=="hello"||got?.[1]!==123) throw new Error("event mismatch");
            const ack=await new Promise((resolve,reject)=>{s.emit("message-with-ack","ack",(a,b)=>resolve([a,b]));setTimeout(()=>reject(new Error("ack timeout")),5000)});
            if(ack[0]!=="ack") throw new Error("ack mismatch");
            await new Promise(r=>s.close().once("disconnect",r));
          }
          await test(["websocket"]);
          await test(["polling"]);
          console.log("Socket.IO client WebSocket + polling PASS");
          EOF
          npm install --ignore-scripts
          npm run build
          npm run socket-test
