name: CI

on:
  push:
    branches: [main, fix/socketio-v4-cross-platform]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Go formatting
        run: |
          echo "Go files requiring formatting:"
          gofmt -l . || true

      - name: Apply temporary polling compatibility patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("transport/transport.go")
          source = path.read_text()

          if '"bytes"' not in source:
              source = source.replace('\t"bufio"\n', '\t"bufio"\n\t"bytes"\n', 1)

          start = source.index('func (c *PollConn) ReadMessage')
          end = source.index('func (c *PollConn) Close', start)
          source = source[:start] + '''func (c *PollConn) ReadMessage() (byte, []byte, error) {
          \tfor {
          \t\tselect {
          \t\tcase p := <-c.recvCh:
          \t\t\tif len(p) == 0 {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tswitch p[0] {
          \t\t\tcase eioPong:
          \t\t\t\tcontinue
          \t\t\tcase eioPing:
          \t\t\t\t_ = c.WriteText([]byte{eioPong})
          \t\t\t\tcontinue
          \t\t\tcase eioMessage:
          \t\t\t\treturn OpText, p[1:], nil
          \t\t\tcase eioClose:
          \t\t\t\treturn OpClose, p, io.EOF
          \t\t\tcase eioNoop:
          \t\t\t\tcontinue
          \t\t\tdefault:
          \t\t\t\treturn OpText, p, nil
          \t\t\t}
          \t\tcase <-c.closed:
          \t\t\treturn 0, nil, errors.New("poll: connection closed")
          \t\t}
          \t}
          }

          ''' + source[end:]

          start = source.index('func decodePollingPayload')
          end = source.index('func NewWSConnForTest', start)
          source = source[:start] + '''func decodePollingPayload(b []byte) [][]byte {
          \tif len(b) == 0 {
          \t\treturn nil
          \t}
          \tparts := bytes.Split(b, []byte{0x1e})
          \tout := make([][]byte, 0, len(parts))
          \tfor _, p := range parts {
          \t\tif len(p) == 0 {
          \t\t\tcontinue
          \t\t}
          \t\tout = append(out, append([]byte(nil), p...))
          \t}
          \treturn out
          }

          ''' + source[end:]

          serve_start = source.index('func (s *Server) servePoll')
          serve_end = source.index('func decodePollingPayload', serve_start)
          serve = source[serve_start:serve_end]
          serve = serve.replace('w.WriteHeader(http.StatusNoContent); return', 'w.WriteHeader(http.StatusOK); _, _ = io.WriteString(w, "ok"); return', 1)
          source = source[:serve_start] + serve + source[serve_end:]

          path.write_text(source)
          PY
          gofmt -w transport/transport.go

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Integration test - Go server + Next.js Socket.IO client
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$(mktemp -d)"
          GO_APP="$TEST_ROOT/go-server"
          NEXT_APP="$TEST_ROOT/next-client"
          mkdir -p "$GO_APP" "$NEXT_APP/app" "$NEXT_APP/scripts"

          cat > "$GO_APP/go.mod" <<EOF
          module integration-go-server

          go 1.22.2

          require github.com/shishir1290/gsocketio v0.0.0
          replace github.com/shishir1290/gsocketio => $GITHUB_WORKSPACE
          EOF

          cat > "$GO_APP/main.go" <<'EOF'
          package main

          import (
            "encoding/json"
            "fmt"
            "log"
            "net/http"

            "github.com/shishir1290/gsocketio"
          )

          func main() {
            sio := gsocketio.New(nil)
            sio.OnConnect("/", func(c gsocketio.Conn) error {
              log.Printf("connected %s", c.ID())
              return nil
            })
            sio.OnEvent("/", "ping", func(c gsocketio.Conn, args []json.RawMessage) {})
            sio.OnDisconnect("/", func(c gsocketio.Conn, reason string) {
              log.Printf("disconnected %s: %s", c.ID(), reason)
            })

            go func() {
              if err := sio.Serve(); err != nil {
                log.Printf("serve: %v", err)
              }
            }()

            http.Handle("/socket.io/", sio)
            fmt.Println("READY")
            log.Fatal(http.ListenAndServe("127.0.0.1:18080", nil))
          }
          EOF

          cat > "$NEXT_APP/package.json" <<'EOF'
          {
            "private": true,
            "scripts": { "build": "next build", "socket-test": "node scripts/socket-test.mjs" },
            "dependencies": {
              "next": "16.3.3",
              "react": "19.2.0",
              "react-dom": "19.2.0",
              "socket.io-client": "4.8.3"
            }
          }
          EOF

          cat > "$NEXT_APP/app/layout.js" <<'EOF'
          export default function RootLayout({ children }) {
            return <html><body>{children}</body></html>
          }
          EOF

          cat > "$NEXT_APP/app/page.js" <<'EOF'
          "use client"

          import { useEffect, useState } from "react"
          import { io } from "socket.io-client"

          export default function Home() {
            const [status, setStatus] = useState("disconnected")
            useEffect(() => {
              const socket = io("http://127.0.0.1:18080", { transports: ["websocket"] })
              socket.on("connect", () => setStatus("connected"))
              socket.on("disconnect", () => setStatus("disconnected"))
              return () => socket.close()
            }, [])
            return <main><h1>gsocketio integration</h1><p>{status}</p></main>
          }
          EOF

          cat > "$NEXT_APP/scripts/socket-test.mjs" <<'EOF'
          import { io } from "socket.io-client"

          const transports = process.env.SOCKET_TRANSPORT === "polling"
            ? ["polling"]
            : ["websocket"]

          const socket = io("http://127.0.0.1:18080", {
            transports,
            timeout: 5000,
            reconnection: false,
          })

          const timeout = setTimeout(() => {
            console.error("Socket.IO client timeout")
            socket.close()
            process.exit(1)
          }, 10000)

          socket.on("connect", () => {
            console.log(`CONNECTED ${socket.id} via ${socket.io.engine.transport.name}`)
            socket.emit("ping", { source: "nextjs-integration" }, () => {
              clearTimeout(timeout)
              console.log("ACK_RECEIVED")
              socket.close()
              process.exit(0)
            })
          })

          socket.on("connect_error", (err) => {
            console.error("CONNECT_ERROR", err.message)
            clearTimeout(timeout)
            socket.close()
            process.exit(1)
          })
          EOF

          (cd "$GO_APP" && go run . > "$TEST_ROOT/go-server.log" 2>&1) &
          GO_PID=$!
          trap 'kill "$GO_PID" 2>/dev/null || true; rm -rf "$TEST_ROOT"' EXIT

          for i in {1..30}; do
            if grep -q '^READY$' "$TEST_ROOT/go-server.log"; then break; fi
            sleep 1
          done
          grep -q '^READY$' "$TEST_ROOT/go-server.log"

          cd "$NEXT_APP"
          npm install --no-audit --no-fund
          npm run build
          npm run socket-test
          SOCKET_TRANSPORT=polling npm run socket-test

      - name: Commit verified library fix
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transport/transport.go
          if git diff --cached --quiet; then
            echo "No library fix changes to commit"
          else
            git commit -m "fix: make Engine.IO polling compatible with Socket.IO v4"
            git push origin HEAD:fix/socketio-v4-cross-platform
          fi
