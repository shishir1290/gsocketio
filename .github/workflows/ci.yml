name: CI

on:
  push:
    branches: [main, fix/socketio-v4-cross-platform]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify zero third-party Go dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^require ' go.mod || true)" -eq 0
          if grep -R --include='*.go' -E '"(github\.com|golang\.org|golang\.google\.org|gopkg\.in)/' . --exclude-dir=.git; then
            echo 'Unexpected third-party Go import found'
            exit 1
          fi

      - name: Go format check
        shell: bash
        run: |
          test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - name: Go race detector
        run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Socket.IO v4 client integration and Next.js build
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          TMP="$(mktemp -d)"
          trap 'kill ${SERVER_PID:-0} 2>/dev/null || true; rm -rf "$TMP"' EXIT

          mkdir -p "$TMP/go-server"
          cd "$TMP/go-server"
          cat > go.mod <<EOF
          module protocol-harness

          go 1.22

          require github.com/shishir1290/gsocketio v0.0.0
          replace github.com/shishir1290/gsocketio => $ROOT
          EOF
          cat > main.go <<'EOF'
          package main

          import (
            "encoding/json"
            "net/http"
            sio "github.com/shishir1290/gsocketio"
          )

          func main() {
            s := sio.New(&sio.Options{PingInterval: 300000000, PingTimeout: 200000000, MaxPayload: 1000000})
            s.OnConnect("/", func(c sio.Conn) error { return c.Emit("auth", c.Context()) })
            s.OnConnect("/custom", func(c sio.Conn) error { return c.Emit("auth", c.Context()) })
            s.OnEvent("/", "message", func(c sio.Conn, args []json.RawMessage) {
              vals := make([]interface{}, len(args)); for i := range args { vals[i] = args[i] }
              _ = c.Emit("message-back", vals...)
            })
            s.OnEvent("/", "message-with-ack", func(c sio.Conn, args []json.RawMessage) {
              vals := make([]interface{}, len(args)); for i := range args { vals[i] = args[i] }
              _ = c.Emit("message-back", vals...)
            })
            go s.Serve()
            http.Handle("/socket.io/", s)
            panic(http.ListenAndServe("127.0.0.1:3000", nil))
          }
          EOF
          go run . >/tmp/gsocketio-server.log 2>&1 & SERVER_PID=$!
          for i in $(seq 1 50); do
            if curl -fsS 'http://127.0.0.1:3000/socket.io/?EIO=4&transport=polling' >/dev/null; then break; fi
            sleep .2
          done

          cd "$TMP"
          mkdir -p next-app/app
          cat > next-app/package.json <<'EOF'
          {"scripts":{"build":"next build","socket-test":"node socket-test.mjs"},"dependencies":{"next":"16.3.3","react":"19.2.0","react-dom":"19.2.0","socket.io-client":"4.8.3"}}
          EOF
          cat > next-app/next.config.mjs <<'EOF'
          export default {};
          EOF
          cat > next-app/app/layout.js <<'EOF'
          export default function Layout({children}){return <html><body>{children}</body></html>}
          EOF
          cat > next-app/app/page.js <<'EOF'
          export default function Page(){return <main>gsocketio integration</main>}
          EOF
          cat > next-app/socket-test.mjs <<'EOF'
          import { io } from "socket.io-client";

          const base = "http://127.0.0.1:3000";

          async function onceConnected(options) {
            const s = io(base, { ...options, timeout: 5000, reconnection: false, auth: { token: "integration" } });
            await new Promise((resolve, reject) => { s.once("connect", resolve); s.once("connect_error", reject); });
            s.close();
          }

          async function test(transports) {
            const s = io(base, { transports, timeout: 5000, reconnection: false, auth: { token: "integration" } });
            await new Promise((resolve, reject) => { s.once("connect", resolve); s.once("connect_error", reject); });

            const auth = await new Promise((resolve, reject) => {
              const t = setTimeout(() => reject(new Error("auth timeout")), 5000);
              s.once("auth", value => { clearTimeout(t); resolve(value); });
            });
            if (auth?.token !== "integration") throw new Error("auth mismatch");

            const event = await new Promise((resolve, reject) => {
              const t = setTimeout(() => reject(new Error("event timeout")), 5000);
              s.once("message-back", value => { clearTimeout(t); resolve(value); });
              s.emit("message", "hello", 123);
            });
            if (event?.[0] !== "hello" || event?.[1] !== 123) throw new Error("event mismatch");

            s.close();
          }

          await onceConnected({ transports: ["websocket"] });
          await onceConnected({ transports: ["polling"] });
          await test(["websocket"]);
          await test(["polling"]);
          await test(["polling", "websocket"]);
          console.log("Socket.IO v4 WebSocket + polling + upgrade PASS");
          EOF
          cd next-app
          npm install --ignore-scripts
          npm run build
          npm run socket-test
